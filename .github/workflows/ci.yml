name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  JUCE_VERSION: 8.0.12

jobs:
  # ---------------------------------------------------------------------------
  # Build + unit tests, then validate the built plug-ins with pluginval/auval.
  # ---------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.build_type }} / ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            arch: arm64
          - build_type: Release
            arch: arm64
          - build_type: Release
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ env.JUCE_VERSION }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-${{ env.JUCE_VERSION }}-

      - name: Configure
        run: >
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build tests
        run: cmake --build build --target JX11Tests -j4

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Build plug-ins
        run: cmake --build build --target JX11_All -j4

      # auval/pluginval load a native binary, so only validate the arm64 build.
      - name: Install pluginval
        if: matrix.arch == 'arm64'
        run: |
          brew install --cask pluginval
          xattr -dr com.apple.quarantine /Applications/pluginval.app || true

      - name: Validate VST3 (pluginval, strictness 10)
        if: matrix.arch == 'arm64'
        run: >
          /Applications/pluginval.app/Contents/MacOS/pluginval
          --strictness-level 10
          --skip-gui-tests
          --validate "$PWD/build/Source/JX11_artefacts/${{ matrix.build_type }}/VST3/JX11+.vst3"

      - name: Validate AU (auval)
        if: matrix.arch == 'arm64'
        run: |
          # The AU was just installed; force the component registrar to rescan it.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 1
          auval -v aumu Jx11 Nimd

  # ---------------------------------------------------------------------------
  # Sanitizer builds. ASan/UBSan and TSan cannot be combined.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitize / ${{ matrix.sanitizers }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        sanitizers:
          - "address,undefined"
          - thread
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ env.JUCE_VERSION }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-${{ env.JUCE_VERSION }}-

      - name: Configure
        run: >
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DJX11_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build tests
        run: cmake --build build --target JX11Tests -j4

      - name: Run tests under sanitizer
        run: ctest --test-dir build --output-on-failure
